[project]
name = "audit-py"
version = "0.1.0"
description = "Client acceptance support system for audit"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy", "matplotlib", "openpyxl"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
